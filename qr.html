<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f5ef">
    <title>Jacob & Julia | QR Codes</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell qr-shell">
      <header class="qr-header">
        <p class="eyebrow">Jacob & Julia</p>
        <h1>QR Codes</h1>
        <p>Wedding details and public photo album.</p>
      </header>

      <section class="qr-grid" aria-label="Wedding links">
        <article class="qr-panel">
          <h2>Wedding Day Site</h2>
          <img class="qr-image" src="assets/wedding-site-qr.svg" alt="QR code for the Jacob and Julia wedding day site">
          <a class="qr-url" href="https://jnellis3.github.io/wedding_page/">https://jnellis3.github.io/wedding_page/</a>
        </article>

        <article class="qr-panel">
          <h2>Public Photo Album</h2>
          <img class="qr-image" src="assets/photo-album-qr.svg" alt="QR code for the Jacob and Julia public photo album">
          <a class="qr-url" href="https://www.icloud.com/sharedalbum/#B1v5nhQSTGe12Le">https://www.icloud.com/sharedalbum/#B1v5nhQSTGe12Le</a>
        </article>
      </section>

      <nav class="qr-actions" aria-label="QR page actions">
        <a class="qr-action" href="index.html">Wedding Site</a>
      </nav>
    </main>
  </body>
</html>
